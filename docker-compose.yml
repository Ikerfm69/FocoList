services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: focolist
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./ToDoList
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/focolist?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Front/Front
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
